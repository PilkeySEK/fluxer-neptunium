[package]
name = "neptunium-gateway"
version.workspace = true
edition = "2024"
license.workspace = true
description = "Interacting with the Fluxer gateway."
repository.workspace = true
readme = "README.md"
keywords = ["api", "fluxer", "fluxer-neptunium"]
publish = true
categories = ["api-bindings", "web-programming::websocket"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
neptunium-model = { workspace = true }
tokio-tungstenite = { version = "0.30.0" }
futures-util = { version = "0.3.34", default-features = false, features = [
    "sink",
    "std",
] }
tokio = { version = "1.54.1", features = ["net", "time", "macros"] }
zeroize = "1.9.1"
tracing = "0.1.44"
serde_path_to_error = "0.1.20"
bon = "3.10.3"
serde_qs = "1.1.3"
tokio-util = { version = "0.7.20", features = ["rt", "time"] }
thiserror = "2.0.21"

[lints]
workspace = true

[features]
default = ["webpki-roots"]
webpki-roots = ["tokio-tungstenite/rustls-tls-webpki-roots"]
native-roots = ["tokio-tungstenite/rustls-tls-native-roots"]
native-tls = ["tokio-tungstenite/native-tls"]
